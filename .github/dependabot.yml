# Renovate owns update PRs; routine Dependabot version PRs are disabled.
# Keep GitHub vulnerability alerts enabled. Automatic security PRs are a separate repo setting.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/rag"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      rag-runtime:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/ingestion"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      ingestion-runtime:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/discord-bot"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      bot-runtime:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      dev-deps:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/services/rag"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: "/services/ingestion"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: "/services/discord-bot"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
