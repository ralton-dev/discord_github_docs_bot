# Weekly reviewed minor/patch PR groups; majors remain separate.
# Security PR groups require enabled repository alerts and security updates. No automerge.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/rag"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rag-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/ingestion"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ingestion-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/services/discord-bot"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      bot-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/services/rag"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/services/ingestion"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/services/discord-bot"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
